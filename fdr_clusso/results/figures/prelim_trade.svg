<circle class="s2 ring" cx="128.7" cy="156.4" r="5.5" stroke-width="1.5"><title>CLUSSO, q = 100, ρ = 0.6: FDP 0.028, TPR 70.3</title></circle>
<circle class="s1 ring" cx="122.7" cy="252.9" r="5.5" stroke-width="1.5"><title>FDR-CLUSSO, q = 100, ρ = 0.6: FDP 0.025, TPR 42.9</title></circle>
