</style>
<rect class="bg" width="720" height="460" rx="8"/>
<style>.s2l{stroke:#eb6834} @media (prefers-color-scheme: dark){.s2l{stroke:#d95926}}</style>
<text class="ink" x="20" y="28" font-size="15" font-weight="600">What FDR control costs: mean FDP vs mean TPR, per cell</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="gray" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<line class="grid" x1="70.0" x2="70.0" y1="52" y2="404"/>
