<text class="ink2" x="280.7" y="398" font-size="11">target 0.10</text>
<text class="ink2" x="380.0" y="446" font-size="12" text-anchor="middle">mean false discovery proportion (lower is better)</text>
<text class="ink2" x="18" y="228.0" font-size="12" text-anchor="middle" transform="rotate(-90 18 228.0)">mean TPR % (higher is better)</text>
